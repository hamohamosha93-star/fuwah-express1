
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فوه إكسبريس</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#f5f6fa;color:#222}
header{background:#087e68;color:white;padding:24px 18px;border-radius:0 0 25px 25px}
header h1{margin:0;font-size:27px}
header p{margin:10px 0 0}
.search{margin:18px}
.search input{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px}
h2{margin:20px 18px 12px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.category{background:white;padding:22px 10px;text-align:center;border-radius:16px;box-shadow:0 2px 9px #0000000c;font-size:17px;font-weight:bold}
.category span{display:block;font-size:35px;margin-bottom:10px}
.offer{margin:20px 16px;background:#087e68;color:white;padding:20px;border-radius:16px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>🚀 فوه إكسبريس</h1>
<p>كل طلباتك من مكان واحد.. وإحنا نوصلها لحد باب بيتك</p>
</header>

<div class="search">
<input type="search" placeholder="بتدور على إيه النهارده؟">
</div>

<h2>اطلب من أقسامنا</h2>

<div class="grid">
<div class="category"><span>🍔</span>مطاعم</div>
<div class="category"><span>💊</span>صيدليات</div>
<div class="category"><span>🛒</span>سوبر ماركت</div>
<div class="category"><span>🥬</span>خضار وفاكهة</div>
<div class="category"><span>📦</span>طرود</div>
<div class="category"><span>🛵</span>مشاوير شخصية</div>
</div>

<div class="offer">
<h3>فوه إكسبريس.. طلبك علينا!</h3>
<p>خدمات التوصيل داخل فوه وضواحيها.</p>
</div>

<footer>© فوه إكسبريس 2026</footer>
</body>
</html>
